[package]
name = "qb64rust-difftest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# The generator of the differential programs (design D2 of `m2-numeric-types`); not part of the compiler. It reads
# `sema`'s type list so that a new numeric type fails its build until the generator covers it.
[dependencies]
qb64rust-sema.workspace = true

[[bin]]
name = "qb64rust-difftest"
path = "src/main.rs"
