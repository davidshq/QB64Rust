<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QB64 extension: UI mockups (study 55)</title>
<style>
  :root {
    --bg: #1f1f1f; --side: #181818; --line: #2b2b2b; --text: #cccccc; --dim: #8b8b8b;
    --accent: #0078d4; --hover: #2a2d2e; --sel: #04395e; --ok: #4ec9a0; --err: #f14c4c; --warn: #cca700;
    --kw: #569cd6; --str: #ce9178; --com: #6a9955; --num: #b5cea8; --fn: #dcdcaa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e0e10; color: #d6d6d6; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding: 20px 28px 0; max-width: 1340px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  header p { margin: 0 0 14px; color: #a0a0a0; max-width: 900px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #333; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: #a0a0a0; padding: 8px 12px;
    font: inherit; cursor: pointer; }
  nav button.on { color: #fff; border-bottom-color: var(--accent); }
  nav button small { display: block; font-size: 11px; color: #777; }
  main { padding: 18px 28px 60px; max-width: 1340px; margin: 0 auto; }
  .lead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
  .lead h2 { font-size: 17px; margin: 0; font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1d3b2f; color: #7fe0b8; }
  .tag.later { background: #3d3214; color: #e6c35c; }
  .tag.alt { background: #2c2c3f; color: #b3b3f0; }
  .tag.api { background: #26262a; color: #9a9a9a; }
  .what { margin: 0 0 12px; color: #b8b8b8; max-width: 980px; }
  .states { margin: 0 0 10px; font-size: 12px; color: #999; }
  .states button { font: inherit; font-size: 12px; background: #222; color: #ccc; border: 1px solid #3a3a3a;
    border-radius: 3px; padding: 2px 9px; margin-left: 4px; cursor: pointer; }
  .states button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  ol.notes { margin: 16px 0 0; padding: 0; list-style: none; columns: 2; column-gap: 36px; max-width: 1280px; }

  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; color: #d7ba7d; }

  /* The VS Code window */
  .vsc { border: 1px solid #3c3c3c; border-radius: 8px; overflow: hidden; background: var(--bg); color: var(--text);
    font-size: 13px; line-height: 1.4; box-shadow: 0 12px 40px #000a; }
  .title { height: 34px; background: var(--side); border-bottom: 1px solid var(--line); display: flex; align-items: center;
    padding: 0 12px; gap: 16px; font-size: 12.5px; }
  .title .menu { color: #bbb; word-spacing: 9px; }
  .title .cmd { flex: 1; max-width: 420px; margin: 0 auto; text-align: center; background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 2px 0; color: #aaa; }
  .title .winbtn { color: #999; letter-spacing: 16px; }
  .body { display: flex; height: 700px; }
  .act { width: 48px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column;

  .act .i { width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; color: #858585;
    border-left: 2px solid transparent; position: relative; }
  .act .i.on { color: #fff; border-left-color: var(--accent); }
  .act svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.5; }
  .act .qb { font: 700 10.5px/1 "Segoe UI", sans-serif; border: 1.6px solid currentColor; border-radius: 4px; padding: 4px 3px; }

  .sec > .h { padding: 4px 8px; font-size: 11px; font-weight: 700; letter-spacing: .3px; color: #ccc; display: flex; gap: 5px; align-items: center; }
  .sec > .h .sp { flex: 1; }
  .sec > .h .tool { font-weight: 400; color: #999; }
  .sec .c { padding: 4px 0 8px; }
  .row { padding: 2px 8px 2px 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .row.l2 { padding-left: 38px; } .row.l3 { padding-left: 54px; }
  .row.sel { background: var(--sel); color: #fff; }
  .row .d { color: var(--dim); font-size: 12px; margin-left: auto; padding-left: 8px; }
  .row .k { width: 14px; text-align: center; color: #c5a5ff; font: 700 10px Consolas, monospace; flex: none; }
  .row .k.f { color: #75beff; } .row .k.e { color: #e2b93d; } .row .k.t { color: #999; }
  .prog { padding: 8px 14px 12px; }
  .prog .file { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .prog .file strong { color: #fff; font-weight: 600; }
  .prog .file span { color: var(--dim); font-size: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff;
    border-radius: 3px; padding: 5px 12px; font-size: 13px; border: 1px solid transparent; white-space: nowrap; }
  .btn.big { width: 100%; padding: 8px; font-size: 14px; font-weight: 600; }
  .btn.sec2 { background: #313131; color: #ddd; border-color: #454545; }
  .btn kbd { font: 11px "Segoe UI", sans-serif; opacity: .75; border: 1px solid #fff5; border-radius: 3px; padding: 0 4px; }
  .btnrow { display: flex; gap: 6px; margin-top: 6px; } .btnrow .btn { flex: 1; padding: 4px 6px; font-size: 12px; }
  .stat { margin-top: 10px; padding: 7px 9px; border-radius: 4px; background: #202020; border: 1px solid var(--line); font-size: 12.5px; }
  .stat.ok b { color: var(--ok); } .stat.err { border-color: #5a2a2a; background: #2a1b1b; } .stat.err b { color: var(--err); }
  .stat b.n, .stat.err b.n { color: #111; }
  .stat a, .lnk { color: #4daafc; text-decoration: none; cursor: pointer; }
  .stat .sub { color: #aaa; margin-top: 3px; }
  .bar { height: 4px; background: #333; border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 45%; background: var(--accent); }
  .search { margin: 2px 12px 6px; background: #313131; border: 1px solid #3c3c3c; border-radius: 3px; padding: 3px 8px; color: #888; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cols { flex: 1; display: flex; min-height: 0; }
  .ed { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .ed:last-child { border-right: 0; }
  .tabs { height: 35px; background: var(--side); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; flex: none; }
  .tab { padding: 0 14px; display: flex; align-items: center; gap: 7px; color: #999; border-right: 1px solid var(--line); white-space: nowrap; }
  .tab.on { background: var(--bg); color: #fff; border-top: 1px solid var(--accent); }
  .tabs .acts { margin-left: auto; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #bbb; }
  .code { flex: 1; overflow: hidden; padding: 8px 0; font: 13.5px/20px Consolas, "Cascadia Mono", monospace; }
  .ln { display: flex; white-space: pre; }
  .ln .g { width: 46px; text-align: right; padding-right: 14px; color: #6e7681; flex: none; }
  .ln.cur { background: #ffffff0a; } .ln.cur .g { color: #ccc; }
  .kw { color: var(--kw); } .str { color: var(--str); } .com { color: var(--com); } .num { color: var(--num); } .fn { color: var(--fn); }
  .sq { text-decoration: underline wavy var(--err); text-underline-offset: 3px; }
  .word { background: #264f78; }
  .hover { margin: 2px 0 2px 150px; width: 430px; background: #202020; border: 1px solid #454545; border-radius: 4px;
    font: 12.5px/1.45 "Segoe UI", sans-serif; white-space: normal; }
  .hover div { padding: 6px 10px; } .hover div + div { border-top: 1px solid #333; color: #bbb; }
  .panel { height: 150px; border-top: 1px solid var(--line); flex: none; display: flex; flex-direction: column; }
  .panel .ptabs { display: flex; gap: 18px; padding: 7px 16px 5px; font-size: 11px; letter-spacing: .4px; color: #999; }
  .panel .ptabs .on { color: #fff; border-bottom: 1px solid var(--accent); padding-bottom: 3px; }
  .panel pre { margin: 0; padding: 2px 16px; font: 13px/19px Consolas, monospace; color: #ccc; }
  .status { height: 24px; background: var(--side); border-top: 1px solid var(--line); display: flex; align-items: center;
    font-size: 12px; color: #bbb; }
  .status span { padding: 0 9px; white-space: nowrap; display: flex; align-items: center; gap: 5px; height: 100%; }
  .status .run { background: var(--accent); color: #fff; } .status .sp { flex: 1; }
  .status .ok { color: var(--ok); } .status .err { color: var(--err); }

  /* Pages in the main area */
  .page { flex: 1; overflow: hidden; padding: 20px 28px; font: 13.5px/1.55 "Segoe UI", sans-serif; }
  .page h3 { font-size: 24px; font-weight: 600; margin: 0 0 4px; color: #fff; font-family: Consolas, monospace; }
  .page h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #999; margin: 16px 0 5px; }
  .page p { margin: 0 0 8px; }
  .page pre { margin: 0; background: #161616; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px;
    font: 13px/19px Consolas, monospace; }
  .page .crumbs { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .page .exbar { display: flex; gap: 8px; margin: 8px 0; }
  .page .see { color: #4daafc; }
  .helpbar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); color: #999; flex: none; }
  .helpbar .search { flex: 1; margin: 0; }

  .wt { flex: 1; display: flex; gap: 34px; padding: 34px 48px; overflow: hidden; }
  .wt .l { width: 400px; flex: none; } .wt .r { flex: 1; }
  .wt h3 { font-size: 22px; font-weight: 600; margin: 0 0 2px; color: #fff; }
  .wt .l > p { color: #999; margin: 0 0 16px; }
  .step { padding: 9px 12px; border-radius: 6px; display: flex; gap: 10px; }
  .step.on { background: #252526; border: 1px solid #3c3c3c; box-shadow: inset 3px 0 var(--accent); }
  .step .o { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #777; margin-top: 2px; flex: none; }
  .step.done .o { background: var(--accent); border-color: var(--accent); }
  .step strong { color: #e6e6e6; font-weight: 600; } .step p { margin: 4px 0 8px; color: #b0b0b0; }
  .shot { border: 1px solid #3c3c3c; border-radius: 6px; background: #161616; height: 330px; display: flex; flex-direction: column; overflow: hidden; }
  .shot .cap { padding: 6px 12px; border-bottom: 1px solid var(--line); color: #999; font-size: 12px; }

  .home { flex: 1; padding: 30px 54px; overflow: hidden; }
  .home h3 { font-size: 26px; font-weight: 300; color: #fff; margin: 0; } .home > p { color: #999; margin: 2px 0 22px; }
  .tiles { display: flex; gap: 14px; margin-bottom: 26px; }
  .tile { flex: 1; background: #252526; border: 1px solid #3c3c3c; border-radius: 8px; padding: 14px 16px; }
  .tile.pri { border-color: var(--accent); background: #0f2b40; }
  .tile strong { display: block; color: #fff; font-size: 15px; margin-bottom: 2px; } .tile span { color: #a8a8a8; font-size: 12.5px; }
  .hcols { display: flex; gap: 44px; } .hcols > div { flex: 1; }
  .hcols h4 { font-size: 13px; color: #ddd; margin: 0 0 8px; font-weight: 600; }
  .hrow { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; } .hrow .d { color: var(--dim); font-size: 12px; }
  .chk { color: var(--ok); width: 16px; flex: none; } .chk.no { color: var(--warn); }

  .runbar { display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .runbar .btn { padding: 2px 9px; font-size: 12px; } .runbar .sp { flex: 1; } .runbar .t { color: var(--dim); font-size: 12px; }
  .stage { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .stage canvas { width: 100%; max-width: 560px; aspect-ratio: 640 / 400; background: #000; image-rendering: pixelated; }
  .warnbox { border: 1px solid #5c4a12; background: #2b2410; color: #e6cf8a; border-radius: 6px; padding: 9px 14px; margin: 0 0 12px; max-width: 980px; }
</style>
</head>
<body>
<header>
  <h1>QB64 extension: UI mockups</h1>
  <p>Mockups for the panel review <code>study\55-editor-experience.md</code>. They are drawings, not the extension: nothing here
     is built. Sizes, colors and wording are guesses in VS Code's dark theme. The numbered notes under each window say
     what each part does and what it is built from.</p>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
// ---------- small helpers ----------
const KEYWORDS = new Set(("SCREEN DO LOOP UNTIL IF THEN OR AND CLS CIRCLE PAINT PRINT END SUB FUNCTION DIM AS INTEGER SHARED FOR TO " +
  "NEXT INPUT ELSE CONST SINGLE STRING RANDOMIZE TIMER WHILE WEND SELECT CASE EXIT LINE STEP COLOR LOCATE SLEEP").split(" "));
const BUILTINS = new Set("INKEY$ CHR$ RND INT STR$ LEN VAL".split(" "));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function color(line) {
  const re = /('.*$)|("[^"]*"?)|(\b\d+(?:\.\d+)?\b)|(_?[A-Za-z][A-Za-z0-9_]*[$%&!#]?)/g;
  let out = "", at = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(at, m.index));
    const t = esc(m[0]), up = m[0].toUpperCase();
    if (m[1]) out += `<span class="com">${t}</span>`;
    else if (m[2]) out += `<span class="str">${t}</span>`;
    else if (m[3]) out += `<span class="num">${t}</span>`;
    else if (KEYWORDS.has(up)) out += `<span class="kw">${t}</span>`;
    else if (up[0] === "_" || BUILTINS.has(up)) out += `<span class="fn">${t}</span>`;
    else out += t;
    at = m.index + m[0].length;
  }
  return out + esc(line.slice(at));
}

// o.cur: the cursor's line; o.err: a line drawn with an error; o.after: {line: html} put under a line
function code(src, o = {}) {
  return `<div class="code">` + src.split("\n").map((l, i) => {
    const n = i + 1;
    let h = color(l);
    if (o.err === n) h = `<span class="sq">${h}</span>`;
    if (o.mark && o.mark.line === n) h = h.replace(o.mark.text, `<span class="word">${o.mark.text}</span>`);
    return `<div class="ln${o.cur === n ? " cur" : ""}"><span class="g">${n}</span><span>${h || " "}</span></div>` +
      (o.after && o.after[n] ? o.after[n] : "");
  }).join("") + `</div>`;
}

const ICONS = {
  files: `<svg viewBox="0 0 24 24"><path d="M14 3H7v14h11V7z M14 3v4h4 M7 7H4v14h10v-4"/></svg>`,
  search: `<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/></svg>`,
  git: `<svg viewBox="0 0 24 24"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 7.2v9.6 M17 11.2c0 4-10 2-10 5.6"/></svg>`,
  debug: `<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>`,
  ext: `<svg viewBox="0 0 24 24"><path d="M4 11h7v9H4z M11 13h7v7h-7z M4 4h7v7H4z M14 3l5 5-5 5-5-5z" /></svg>`,
};
function act(on, badge) {
  const item = (k) => `<div class="i${on === k ? " on" : ""}">${ICONS[k]}</div>`;
  return item("files") + item("search") + item("git") + item("debug") + item("ext") +
    `<div class="i${on === "qb" ? " on" : ""}"><span class="qb">QB</span>${badge ? `<b class="n">${badge}</b>` : ""}</div>`;
}

function win(o) {
  return `<div class="vsc">
    <div class="title"><span class="menu">File Edit Selection View Go Run Terminal Help</span>
      <span class="cmd">${o.title || "bounce"}</span><span class="winbtn">&#8211;&#9633;&#10005;</span></div>
    <div class="body">
      <div class="act">${act(o.icon, o.badge)}</div>
      ${o.side ? `<div class="side">${o.side}</div>` : ""}
      <div class="main"><div class="cols">${o.cols}</div>${o.panel ? `<div class="panel">${o.panel}</div>` : ""}</div>
    </div>
    <div class="status">${o.status}</div>
  </div>`;
}

const tabs = (names, on, acts = "") => `<div class="tabs">` +
  names.map((t) => `<span class="tab${t === on ? " on" : ""}">${t}</span>`).join("") +
  (acts ? `<span class="acts">${acts}</span>` : "") + `</div>`;

function status(state, n) {
  const s = state === "err" ? `<span class="err">&#10005; 1 error: line 10</span>`
    : state === "busy" ? `<span>&#8635; Getting ready&hellip;</span>` : `<span class="ok">&#10003; OK</span>`;
  return `<span class="run">&#9654; Run</span>${s}${n ? `<b class="n">${n}</b>` : ""}<span class="sp"></span>
    <span>Ln 10, Col 5</span><span>Spaces: 4</span><span>cp437</span><span>{} QB64</span>`;
}

// ---------- the sample programs ----------
const BOUNCE = `' A ball that bounces off the edges of the window
SCREEN _NEWIMAGE(640, 400, 32)
_TITLE "Bounce"
x = 320: y = 200: dx = 3: dy = 2
DO
    CLS
    DrawBall x, y
    x = x + dx: y = y + dy
    IF x < 12 OR x > 628 THEN dx = -dx
    IF y < 12 OR y > 388 THEN dy = -dy
    _DISPLAY
    _LIMIT 60
LOOP UNTIL INKEY$ = CHR$(27)
END

SUB DrawBall (x, y)
    CIRCLE (x, y), 12, _RGB32(255, 200, 0)
    PAINT (x, y), _RGB32(255, 200, 0)
END SUB`;
const BOUNCE_ERR = BOUNCE.replace("IF y < 12 OR y > 388 THEN dy = -dy", "IF y < 12 OR y > 388 dy = -dy");

const HEALTH = `' Lose and gain health, never below 0 or above 100
health = 60
DO
    INPUT "Change health by"; change
    health = _CLAMP(health + change, 0, 100)
    PRINT "Health is now"; health
LOOP UNTIL health = 0
PRINT "Game over"
END`;

// ---------- the QB64 side panel ----------
function programView(state) {
  const st = state === "err"
    ? `<div class="stat err"><b>&#10005; Line 10:</b> THEN is missing after the condition of this IF.
         <div class="sub"><a>Go to line 10</a> &nbsp;&middot;&nbsp; <a>Help on IF</a></div></div>`
    : state === "busy"
    ? `<div class="stat"><b>Getting ready to build, once</b>
         <div class="sub">Building the QB64 runtime. About 40 seconds, only the first time.</div><div class="bar"><i></i></div></div>`
    : `<div class="stat ok"><b>&#10003; OK</b> &nbsp;No errors. Last run ended normally.</div>`;
  return `<div class="prog">
    <div class="file"><strong>bounce.bas</strong><span>the program Run builds</span><b class="n">2</b></div>
    <div class="btn big">&#9654;&nbsp; Run <kbd>F5</kbd></div>
    <div class="btnrow"><div class="btn sec2">Debug</div><div class="btn sec2">Run in Browser</div><div class="btn sec2">Build only</div></div>
    ${st.replace("</b>", `</b> <b class="n">3</b>`)}
  </div>`;
}

function sidePanel(state, open = { subs: true, ex: true, help: true }) {
  return `<div class="head"><span>QB64</span><span>&#8943;</span></div>
    <div class="sec"><div class="h">&#9662; PROGRAM</div><div class="c" style="padding:0">${programView(state)}</div></div>
    <div class="sec"><div class="h">&#9662; SUBS AND FUNCTIONS <b class="n">4</b><span class="sp"></span><span class="tool">A&ndash;Z</span></div><div class="c">
      <div class="row"><span class="k t">&#9670;</span>Main program<span class="d">bounce.bas</span></div>
      <div class="row sel"><span class="k">S</span>DrawBall (x, y)<span class="d">bounce.bas</span></div>
      <div class="row"><span class="k f">F</span>Speed! (level)<span class="d">rules.bm</span></div>
    </div></div>
    <div class="sec"><div class="h">&#9662; EXAMPLES <b class="n">5</b></div><div class="c">
      <div class="row">&#9662; First steps</div>
      <div class="row l2"><span class="k e">&#9654;</span>Hello</div>
      <div class="row l2"><span class="k e">&#9654;</span>Guess the number</div>
      <div class="row l2"><span class="k e">&#9654;</span>Draw with the mouse</div>
      <div class="row">&#9656; Graphics</div>
      <div class="row">&#9656; Sound and music</div>
      <div class="row">&#9656; Small games</div>
      <div class="row">&#9656; One for every keyword<span class="d">333</span></div>
    </div></div>
    <div class="sec"><div class="h">&#9662; HELP <b class="n">6</b></div><div class="c">

// ---------- the page ----------
let current = 0, state = "ok";
function show(i) {
  current = i;
  const s = SCREENS[i];
  document.getElementById("nav").innerHTML = SCREENS.map((x, k) =>
    `<button class="${k === i ? "on" : ""}" onclick="go(${k})">${x.nav}<small>${x.sub}</small></button>`).join("");
  const states = s.states ? `<div class="states">Show the Program view with:` + s.states.map(([k, t]) =>
    `<button class="${k === state ? "on" : ""}" onclick="setState('${k}')">${t}</button>`).join("") + `</div>` : "";
  document.getElementById("main").innerHTML =
    `<div class="lead"><h2>${s.title}</h2>${s.tags}</div><p class="what">${s.what}</p>` +
    (s.warn ? `<div class="warnbox">${s.warn}</div>` : "") + states + s.render(state) +
    `<ol class="notes">` + s.notes.map((n, k) => `<li><b class="n">${k + 1}</b>${n}</li>`).join("") + `</ol>`;
  if (s.after) s.after();
}
function go(i) { location.hash = "#" + (i + 1) + (state !== "ok" ? "-" + state : ""); }
function setState(k) { state = k; go(current); }
function fromHash() {
  const m = /^#(\d)(?:-(\w+))?$/.exec(location.hash);
  state = m && m[2] ? m[2] : "ok";
  show(m ? Math.min(SCREENS.length, Math.max(1, +m[1])) - 1 : 0);
}
window.addEventListener("hashchange", fromHash);
fromHash();
