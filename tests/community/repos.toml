# Community repositories checked by tools/community/community.py (openspec change community-programs).
#
# Each [[repo]] is pinned to the full commit of its default branch as of 2026-11-09, the day it was added.
# A pin is added or moved only after `community.py audit` has been read (design D8, D9).
#   name          prefix of the repository's programs on pass.list; also its folder below the clones' root
#   url           where `community.py fetch` clones from
#   commit        full SHA-1
#   license       as the GitHub API reports it ("none" when it reports no license)
#   submodules    path -> url and commit; cloned from this URL, never from the repository's .gitmodules
#   include_root  a repository's name: that clone's folder is the compiler's --include-root for these programs
#
# Left out (study 44): qb40/abc-archive (packed programs), gmunaro/openstrut-v1 (provenance),
# hsehestedt/WIM-Tools (edits Windows images), the hoard of GW-BASIC programs and Microsoft's samples
# (a later step), QB64-Archives (1 GB).

