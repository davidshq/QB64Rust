[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Same as rust-toolchain.toml.
rust-version = "1.88"
publish = false

[workspace.dependencies]
qb64rust-base = { path = "crates/base" }
qb64rust-syntax = { path = "crates/syntax" }
qb64rust-builtins = { path = "crates/builtins" }
qb64rust-sema = { path = "crates/sema" }
qb64rust-ir = { path = "crates/ir" }
qb64rust-codegen-cpp = { path = "crates/codegen-cpp" }
insta = "1"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Numeric semantics is the compiler's job: every `as` that can lose or reinterpret bits is deliberate (study\21).
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# An overflow in the compiler's own arithmetic is a bug: panic in release too, so tests and the shipped binary
# behave the same (study\21). Wrapping that BASIC semantics needs is written as `wrapping_*`.
[profile.release]
overflow-checks = true
