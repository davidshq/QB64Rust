[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Same as rust-toolchain.toml.
rust-version = "1.99"
publish = false

[workspace.dependencies]
qb64rust-base = { path = "crates/base" }
qb64rust-syntax = { path = "crates/syntax" }
qb64rust-builtins = { path = "crates/builtins" }
qb64rust-sema = { path = "crates/sema" }
qb64rust-ir = { path = "crates/ir" }
qb64rust-codegen-cpp = { path = "crates/codegen-cpp" }
qb64rust-lsp = { path = "crates/lsp" }
insta = "1"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Numeric semantics is the compiler's job: every `as` that can lose or reinterpret bits is deliberate (study\21).
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# An overflow in the compiler's own arithmetic is a bug: panic in release too, so tests and the shipped binary
# behave the same (study\21). Wrapping that BASIC semantics needs is written as `wrapping_*`.
[profile.release]
overflow-checks = true

# Tier 1 runs the front end over every input set and every mutant in a debug build. Measured once on 2026-10-14
# (DECISIONS.md): a whole run took 54 s unoptimised and 16 s at opt-level 1; a rebuild after touching one crate
# took 10-20 s against 7-16 s, and a build from nothing 61 s. Overflow checks and debug assertions stay on: they do
# not depend on the opt-level. The cost: a debugger shows fewer variables (some are optimised away).
[profile.dev]
opt-level = 1
