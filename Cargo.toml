[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
qb64rust-base = { path = "crates/base" }
qb64rust-syntax = { path = "crates/syntax" }
qb64rust-builtins = { path = "crates/builtins" }
qb64rust-sema = { path = "crates/sema" }
qb64rust-ir = { path = "crates/ir" }
qb64rust-codegen-cpp = { path = "crates/codegen-cpp" }
insta = "1"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
