[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Same as rust-toolchain.toml.
rust-version = "1.99"
publish = false
# The repository's licence (LICENSE; DECISIONS.md 2026-10-19).
license = "MIT"

[workspace.dependencies]
qb64rust-base = { path = "crates/base" }
qb64rust-syntax = { path = "crates/syntax" }
qb64rust-builtins = { path = "crates/builtins" }
qb64rust-sema = { path = "crates/sema" }
qb64rust-format = { path = "crates/format" }
qb64rust-ir = { path = "crates/ir" }
qb64rust-codegen-cpp = { path = "crates/codegen-cpp" }
qb64rust-lsp = { path = "crates/lsp" }
qb64rust-dap = { path = "crates/dap" }
# The high-precision reference of the `CONST` evaluator's functions (`sema` `certify.rs`; DECISIONS.md 2026-10-17).
astro-float-num = { version = "0.3.7", default-features = false, features = ["std"] }
insta = "1"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
# The SHA-256 of the toolchain download (`driver` `toolchain.rs`; OpenSpec change `m6-toolchain`, design D2).
sha2 = "0.10"
tempfile = "3"
# Reads `qb64rust.toml` (`driver` `fixes.rs`; OpenSpec change `fixes-switch`, design D2): as a table with its spans,
# no serde derive.
toml = { version = "1", default-features = false, features = ["std", "parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Numeric semantics is the compiler's job: every `as` that can lose or reinterpret bits is deliberate
# (study\archive\21).
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# An overflow in the compiler's own arithmetic is a bug: panic in release too, so tests and the shipped binary
# behave the same (study\archive\21). Wrapping that BASIC semantics needs is written as `wrapping_*`.
[profile.release]
overflow-checks = true

# Tier 1 runs the front end over every input set and every mutant in a debug build. Measured once on 2026-10-14
# (DECISIONS.md): a whole run took 54 s unoptimised and 16 s at opt-level 1; a rebuild after touching one crate
# took 10-20 s against 7-16 s, and a build from nothing 61 s. Overflow checks and debug assertions stay on: they do
# not depend on the opt-level. The cost: a debugger shows fewer variables (some are optimised away).
[profile.dev]
opt-level = 1
