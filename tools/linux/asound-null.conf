# ALSA's configuration for test runs on a Linux machine without a sound card (OpenSpec change m7-linux, design D6):
# the default device takes every sample and plays nothing, so that a sound program of the suites runs as it does
# with a card. Used by pointing ALSA_CONFIG_PATH at this file, which then replaces ALSA's own configuration:
#
#     ALSA_CONFIG_PATH=tools/linux/asound-null.conf python3 tools/legacy_tests/run_legacy_tests.py ...
#
# CI sets it (.github/workflows/rust.yml, job linux). In WSL, WSLg's PulseAudio server plays the sound instead,
# and the variable is not needed.

pcm.!default {
    type null
}

pcm.null {
    type null
}
