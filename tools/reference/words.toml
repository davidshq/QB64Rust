# The hand-kept part of the language reference's inventory (tools/reference/README.md, study/49 §7).
# reference.py reads the words themselves from the built-in table, the parser's reserved words, the formatter's
# spellings and the VS Code grammar; this file says only what those sources cannot.

# The batches whose pages must all exist. Every page of a batch named here is required by --check.
done = [1, 2, 3]

# The pilot pages (study/49 §5), required whatever `done` says.
pilot = ["left-str", "line", "select-case", "meta-include", "_memcopy", "fre"]

# A word found by no batch's spec goes to this batch ("the rest").
default_batch = 20
# A built-in that the math batch would take but that works on strings goes to the strings batch.
math_batch = 8
string_batch = 7

# Two words that are one statement of their own: the first word alone does not match them (`LINE` is not found in
# `LINE INPUT`). Each is a word of the inventory ([extra]), with its page.
compounds = ["LINE INPUT", "VIEW PRINT", "PRINT USING", "ON ERROR", "DEF SEG", "DECLARE LIBRARY"]

[batches]
1 = "Lines, names, comments, labels, $INCLUDE, the preprocessor"
2 = "Types, literals, operators, conversions"
3 = "Variables, scope, constants"
4 = "Control flow"
5 = "Procedures"
6 = "Arrays and TYPE"
7 = "Strings"
8 = "Math and number functions"
9 = "PRINT, PRINT USING, console and text output"
10 = "Keyboard and console input"
11 = "Errors"
12 = "Files"
13 = "Screen modes and drawing"
14 = "Images and fonts"
15 = "Mouse and devices"
16 = "Sound"
17 = "Events and timers"
18 = "Memory"
19 = "Libraries"
20 = "Window, clipboard, system, date and time"
21 = "Data processing, embedded files, logging"
22 = "Network"
23 = "OpenGL"
24 = "Appendices"

