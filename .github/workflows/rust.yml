# Tier 1 of the test cadence (study\archive\19) for the compiler workspace on Windows: formatting, clippy with warnings
# as errors, and cargo test (unit, snapshots, tests\frontend, the corpus front end, the language server). Needs no
# QB64pe: the tests that build an executable are #[ignore]d. Lint choices: study\archive\21. `cargo deny check` in its
# own job.
name: Rust

on:
  push:
    paths-ignore:
      - "vscode/**"
      - "study/**"
      - "openspec/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "vscode/**"
      - "study/**"
      - "openspec/**"
      - "**.md"
  # Tier 2 runs only from here ("Run workflow"); its weekly run was stopped (DECISIONS.md 2026-10-28).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The runner's default (core.autocrlf true) would turn LF into CR LF; tests and snapshots see the bytes as
      # committed, as on a development machine with autocrlf input.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # CI is set, so insta fails on a changed snapshot instead of writing a .snap.new file.
      - run: cargo test --workspace --locked

      # The test runner's own rules (what "pass" means, what gets recorded): standard library only, no compiler.
      - run: python -m unittest discover -s tools/legacy_tests -p "test_*.py"
      # The same for the record of test runs (which commands count as a run, what is read as its result).
      - run: python -m unittest discover -s tools/testtime -p "test_*.py"
      # The same for the plan and check of a change's closing runs (which logs show a pass, when one is stale).
      - run: python -m unittest discover -s tools/close -p "test_*.py"
      # The same for the coverage report and check of Civil War Strategy's scripts (merging, the list of unreached lines).
      - run: python -m unittest discover -s tools/coverage -p "test_*.py"
      # The same for the wording table's rules (which old messages name a file).
      - run: python -m unittest discover -s tools/diagnostics -p "test_*.py"
      # The same for the OpenGL table's reading of libqb's gl.h (the old compiler's rules; the written files current).
      - run: python -m unittest discover -s tools/opengl -p "test_*.py"
      # The same for the QB 4.5 runner's text handling (no DOSBox or QB 4.5 needed).
      - run: python -m unittest discover -s tools/qb45 -p "test_*.py"

  # Licences, advisories and sources of the dependencies (deny.toml; study\archive\21 item 7). The action runs on Linux;
  # the dependency graph is the same on every platform.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Linux x64 (OpenSpec change m7-linux, design D10): the system toolchain and its packages (the Debian line of
  # crates\driver\src\toolchain.rs, PACKAGES), lldb-20 for the debugger tests (24.04's
  # plain lldb is 18, older than toolchain.rs LLDB_DAP_MINIMUM) and Xvfb for the window programs. Tier 1,
  # the CLI tests that build, and the slice list judged by the Linux recordings. Needs no QB64pe: the tests that
  # compare with qb64pe.exe are Windows' (cfg(windows)). Sound programs run with ALSA's null device (the runner
  # sets ALSA_CONFIG_PATH to tools/linux/asound-null.conf).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglu1-mesa-dev libasound2-dev libpng-dev libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lldb-20 xvfb

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tools/legacy_tests -p "test_*.py"
      # The CLI tests that build an executable (and the debugger's), with a display for the window programs.
      - run: xvfb-run -a cargo test -p qb64rust-driver --test cli --locked -- --ignored
      - run: cargo build --release --locked
      - name: The slice list
        run: xvfb-run -a python3 tools/legacy_tests/run_legacy_tests.py --suite corpus --qb64 target/release/qb64rust --jobs 4 --list tests/corpus/slice.list

  # Tier 2 (study\archive\19): the slice list of the corpus and the upstream pass list end to end, built against
  # QB64pe's sources at the commit of the local reference clone, the one reference for expected outputs (DECISIONS.md
  # 2026-10-09, study\archive\28 section 2). The C++ toolchain is taken from the 4.7.0 release download, which is 16
  # commits older and ships it under internal\c\c_compiler. Written 2026-10-09. The upstream programs come from the
  # clone's tests\compile_tests (its binary assets; the copy in tests\upstream holds text files only).
  # The call-site check (tools\callsite, DECISIONS.md 2026-10-10) needs the old compiler itself, so qb64pe.exe is
  # built once from the checked-out sources, as setup_win.cmd builds it, and cached with them. The release's
  # qb64pe.exe will not do: the reference commit's compiler writes other C++ for VAL(s$, SINGLE) and VAL(s$,
  # DOUBLE) (study\archive\29 section 8).
  # Not on a push or a pull request (user, DECISIONS.md 2026-10-12): the job takes about 20 minutes and tier 2 is
  # run locally at the close of each change. It runs only when started by hand ("Run workflow"): a weekly run that
  # nobody waits on and that the runner cannot pass whole (no window for screen programs) was stopped
  # (DECISIONS.md 2026-10-28).
  tier2:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QB64PE_COMMIT: 16f629784ebddd31ca45bd9b8a1b75a8d98ea338
      QB64PE_TAG: v4.7.0-GLFW
      QB64PE_ASSET: qb64pe_win-x64-4.7.0-GLFW.7z
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Its own key: the cache also keeps the libqb objects qb64rust's builds compile (console-only settings),
      # which differ from those the extension's workflow caches.
      - name: Cache QB64pe
        id: qb64pe-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\qb64pe
          key: qb64pe-${{ env.QB64PE_COMMIT }}-${{ env.QB64PE_ASSET }}-qb64rust-3

      # The release archive unpacks into a folder qb64pe; only its toolchain is kept. The sources (qbx.cpp, libqb,
      # the Makefile) are checked out at the reference commit; qb64rust's builds compile libqb from them.
      - name: Get QB64pe (sources at the reference commit, toolchain of the release)
        if: steps.qb64pe-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:QB64PE_TAG -R QB64-Phoenix-Edition/QB64pe -p $env:QB64PE_ASSET
          7z x -y $env:QB64PE_ASSET
          Remove-Item $env:QB64PE_ASSET
          Rename-Item qb64pe qb64pe-release
          git init qb64pe
          git -C qb64pe fetch --depth 1 https://github.com/QB64-Phoenix-Edition/QB64pe $env:QB64PE_COMMIT
          git -C qb64pe checkout FETCH_HEAD
          Move-Item qb64pe-release\internal\c\c_compiler qb64pe\internal\c\c_compiler
          Remove-Item -Recurse -Force qb64pe-release
          Push-Location qb64pe
          & internal\c\c_compiler\bin\mingw32-make.exe -j4 OS=win BUILD_QB64=y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - run: cargo build --release --locked

      # The libqb call of each built-in, compared with the old compiler's (spec testing/call-site-check). First,
      # while the clone's internal\temp is not in use by a build.
      - name: Call-site check
        env:
          QB64RUST_QB64PE_ROOT: ${{ runner.temp }}\qb64pe
        run: python tools/callsite/callsite.py --qb-root $env:QB64RUST_QB64PE_ROOT

      # Without the screen programs: the runner gives them no window, so each waits out its time limit (seen
      # 2026-10-16, run 38923356942). They are run locally only (STATUS.md, DECISIONS.md 2026-10-16).
      - name: Corpus slice list (console programs)
        env:
          QB64RUST_QB64PE_ROOT: ${{ runner.temp }}\qb64pe
        run: |
          Get-Content tests/corpus/slice.list | Where-Object { $_ -notmatch '^screen/' } | Set-Content "$env:RUNNER_TEMP/slice-console.list"
          python tools/legacy_tests/run_legacy_tests.py --suite corpus --qb-root $env:QB64RUST_QB64PE_ROOT `
            --qb64 target/release/qb64rust.exe --list "$env:RUNNER_TEMP/slice-console.list"

      # From the clone's tests\compile_tests, not the copy tests/upstream/compile_tests: two programs of the list
      # need the binaries lib-windows.a and lib.dll, which the copy (text files only) lacks (m3-declare-library D4).
      - name: Upstream pass list
        env:
          QB64RUST_QB64PE_ROOT: ${{ runner.temp }}\qb64pe
        run: >
          python tools/legacy_tests/run_legacy_tests.py --suite compile --qb-root $env:QB64RUST_QB64PE_ROOT
          --qb64 target/release/qb64rust.exe --list tests/upstream/pass.list

      # The differential programs of the pass list against their recordings (spec testing/differential-tests).
      - name: Differential pass list
        env:
          QB64RUST_QB64PE_ROOT: ${{ runner.temp }}\qb64pe
        run: >
          python tools/legacy_tests/run_legacy_tests.py --suite corpus --qb-root $env:QB64RUST_QB64PE_ROOT
          --corpus-root tests/differential --qb64 target/release/qb64rust.exe --list tests/differential/pass.list
