name: License inventory

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/licenses/check.py
      - run: python -m unittest discover -s tools/licenses -p "test_*.py"
