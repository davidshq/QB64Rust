name: License inventory

# Started by hand only ("Run workflow"; OpenSpec change testing-reset, task 6.0): `just full` in a worktree is the
# check before a merge into main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/licenses/check.py
      - run: python -m unittest discover -s tools/licenses -p "test_*.py"
