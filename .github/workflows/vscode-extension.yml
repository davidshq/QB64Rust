# Tests the VS Code extension in vscode\ on Windows (and on Linux, job linux): lint, unit, grammar, and the integration suite on VS Code stable
# and on the oldest supported version (engines.vscode), against the QB64pe release the extension is tested with and
# with the language server from this repository's qb64rust (built first, release); packages the win32-x64 .vsix.
name: VS Code extension

on:
  push:
    paths:
      - "vscode/**"
      - "crates/**"
      - "libqb/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "vscode/**"
      - "crates/**"
      - "libqb/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same version as the reference clone (..\QB64pe) the fixtures were recorded with.
  QB64PE_TAG: v4.7.0-GLFW
  QB64PE_ASSET: qb64pe_win-x64-4.7.0-GLFW.7z

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      # The language server: `qb64rust lsp` (change m2-language-server, design D7).
      - run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p qb64rust-driver
        working-directory: .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # The archive is about 100 MB. The cache is saved after the first run, so it also keeps the runtime library
      # that QB64pe compiles on its first build.
      - name: Cache QB64pe
        id: qb64pe-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\qb64pe
          key: qb64pe-${{ env.QB64PE_ASSET }}

      - name: Download QB64pe
        if: steps.qb64pe-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:QB64PE_TAG -R QB64-Phoenix-Edition/QB64pe -p $env:QB64PE_ASSET
          7z x -y $env:QB64PE_ASSET
          Remove-Item $env:QB64PE_ASSET

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:grammar

      - name: Integration tests (VS Code stable)
        run: npm run test:integration
        env:
          QB64RUST_TEST_QB64PE: ${{ runner.temp }}\qb64pe\qb64pe.exe
          QB64RUST_TEST_QB64RUST: ${{ github.workspace }}\target\release\qb64rust.exe

      - name: Integration tests (oldest supported VS Code)
        run: npm run test:integration:min
        env:
          QB64RUST_TEST_QB64PE: ${{ runner.temp }}\qb64pe\qb64pe.exe
          QB64RUST_TEST_QB64RUST: ${{ github.workspace }}\target\release\qb64rust.exe

      # The platform package (change extension-vsix): stages the binary built above, libqb and the crates' notice,
      # then holds the package to spec editor/packaging.
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm run package
      - run: python scripts/check_vsix.py qb64rust-win32-x64-$((Get-Content package.json | ConvertFrom-Json).version).vsix

      - uses: actions/upload-artifact@v7
        with:
          name: qb64rust-vsix
          path: vscode/*.vsix
          if-no-files-found: error

  # Linux x64 (OpenSpec change m7-linux, design D10): the same tests with the Linux qb64rust, under Xvfb (VS Code
  # needs a display), with the system toolchain and its packages (the Debian line of toolchain.rs, PACKAGES). No
  # QB64pe: the tests that need it are skipped without QB64RUST_TEST_QB64PE. Packages the linux-x64 .vsix.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      - name: Install the packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglu1-mesa-dev libasound2-dev libpng-dev libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lldb-20 xvfb

      - run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p qb64rust-driver
        working-directory: .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:grammar

      - name: Integration tests (VS Code stable)
        run: xvfb-run -a npm run test:integration
        env:
          QB64RUST_TEST_QB64RUST: ${{ github.workspace }}/target/release/qb64rust

      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: npm run package:linux
      - run: python3 scripts/check_vsix.py qb64rust-linux-x64-$(node -p "require('./package.json').version").vsix

      - uses: actions/upload-artifact@v7
        with:
          name: qb64rust-vsix-linux
          path: vscode/*.vsix
          if-no-files-found: error
