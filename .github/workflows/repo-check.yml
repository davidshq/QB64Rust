# Project rules that a script can check (CLAUDE.md human rule 2, working rule 5): no local paths, temp folders or network shares
# in tracked files, no stray control bytes. Runs on every change, documents included.
name: Repo check

# Started by hand only ("Run workflow"; OpenSpec change testing-reset, task 6.0): `just full` in a worktree is the
# check before a merge into main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/repo_check/check_repo.py
